# 그래프 조회본 (ADR-0031, 백로그 G-2). 시크릿: SUPABASE_URL, SUPABASE_SECRET_KEY
# Git 의 그래프(research/ecosystems/seed_graph.json)가 바뀌어 main 에 병합될 때마다 Supabase core.graph_nodes·graph_edges·graph_terms 를 덮어쓴다.
# 예약 작업은 core.resolve_terms · graph_neighbors · suppliers_below · node_signals 로 그래프를 조회한다 (0035). LLM 없음, 비용 없음.
# 놓친 병합이 있어도 아침 해석(06:17) 전에 맞도록 매일 05:07 KST 에도 한 번 돈다.
name: graph-sync

on:
  push:
    branches: [main]
    paths:
      - "research/ecosystems/**"
      - "pipeline/wsj/ecosystems/graph_sync.py"
  schedule:
    - cron: "7 20 * * *"   # 20:07 UTC = 05:07 KST
  workflow_dispatch:

concurrency:
  group: graph-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WSJ_STORE: postgrest
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install
        working-directory: pipeline
        run: pip install -e .
      - name: Validate and sync
        working-directory: pipeline
        run: |
          set -euo pipefail
          python -m wsj.ecosystems.ontology --check | tail -1
          python -m wsj.ecosystems.graph_sync run | tee -a "$GITHUB_STEP_SUMMARY"
