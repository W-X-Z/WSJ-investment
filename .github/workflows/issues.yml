# 공급망 이슈 피드 (ADR-0014) + 투자 아이디어 입력 (ADR-0016). 시크릿: SUPABASE_URL, SUPABASE_SECRET_KEY, ANTHROPIC_API_KEY,
# 선택: DART_API_KEY (한국 공시), OPENALEX_API_KEY
# 아침 실행은 Claude 예약작업(06:41 KST)이 Run workflow 로 시킨다 — GitHub 예약 실행은 몇 시간씩 늦을 때가 있어서
#   실행 시점을 예약작업 한 곳에서 관리한다(2026-10-28). 수집이 끝나면 같은 예약작업이 아이디어를 쓴다 (ADR-0016 개정 2).
#   뉴스·업계지·뉴스룸·SEC 8-K·관보·정책·TrendForce·논문·지표 → 이슈 선별(Sonnet ≈ $0.1) → 기업별 최신 소식 → ideas.company_events
#   → 그래프 상장사 가격 (ADR-0017)
# 18:47 KST (09:47 UTC) 예약: 기업 소식·가격 수집·저장만 (LLM 없음, 늦어도 괜찮은 작업이라 GitHub 예약에 둔다)
# API 로 아이디어를 쓰려면 Run workflow 에서 ideas_api=true (대체 경로). 코드 병합(push)으로는 돌지 않는다.
name: issues

on:
  schedule:
    - cron: "47 9 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "수집 창(일)"
        required: false
        default: "14"
      model:
        description: "선별 모델: sonnet | haiku"
        required: false
        default: "sonnet"
      no_llm:
        description: "true 면 규칙 점수만"
        required: false
        default: "false"
      feed_days:
        description: "기업 소식 수집 창(일). 첫 실행·누락 보충은 14"
        required: false
        default: "7"
      ideas_api:
        description: "true 면 투자 아이디어를 API LLM 으로도 쓴다 (예약작업이 못 돌 때 대체 경로)"
        required: false
        default: "false"
      ideas_model:
        description: "ideas_api=true 일 때 모델: sonnet | opus"
        required: false
        default: "sonnet"

concurrency:
  group: issues
  cancel-in-progress: false

jobs:
  issues:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WSJ_STORE: postgrest
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      SEC_USER_AGENT: "WSJ-investment research dnltmdwhd@gmail.com"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install
        working-directory: pipeline
        run: pip install -e .
      - name: Collect, curate and save issues
        if: ${{ github.event.schedule != '47 9 * * *' }}
        working-directory: pipeline
        env:
          IN_DAYS: ${{ inputs.days || '14' }}
          IN_MODEL: ${{ inputs.model || 'sonnet' }}
          IN_NO_LLM: ${{ inputs.no_llm || 'false' }}
        run: |
          set -euo pipefail
          args=(run --days "$IN_DAYS" --model "$IN_MODEL" --out data/issues/latest.json)
          [[ "$IN_NO_LLM" == "true" ]] && args+=(--no-llm)
          python -m wsj.ecosystems.issues "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      # 기업별 최신 소식 → ideas.company_events (아침 7일, 저녁 3일. 아이디어는 DB 에 쌓인 14일을 본다)
      - name: Collect company events
        working-directory: pipeline
        env:
          IN_FEED_DAYS: ${{ github.event.schedule == '47 9 * * *' && '3' || inputs.feed_days || '7' }}
        run: |
          set -euo pipefail
          mkdir -p data/issues
          python -m wsj.ecosystems.company_feed --days "$IN_FEED_DAYS" --save --out data/issues/company_events.json | tee -a "$GITHUB_STEP_SUMMARY"
      # 그래프 상장사 일봉 → raw.px_daily (ADR-0017). 가격은 '이미 움직인 폭'과 설명 안 된 급변 탐지에만 쓴다.
      # 증분은 매번 전부, 1년 이력 백필은 남은 시간(아침 10분·저녁 15분)만큼 나눠서. 실패해도 다음 단계는 돈다.
      - name: Collect prices
        continue-on-error: true
        working-directory: pipeline
        env:
          IN_BUDGET: ${{ github.event.schedule == '47 9 * * *' && '15' || '10' }}
        run: |
          set -euo pipefail
          python -m wsj.ecosystems.prices run --budget-min "$IN_BUDGET" | tee -a "$GITHUB_STEP_SUMMARY"
      # 발행주식수·환율 → 시가총액 (v_company_facts). 미국은 하루 40곳씩 30일 주기, 나머지 시장은 일괄. 실패해도 다음 단계는 돈다.
      - name: Collect company facts (shares, FX)
        continue-on-error: true
        working-directory: pipeline
        run: |
          set -euo pipefail
          python -m wsj.ecosystems.facts run --max-us 40 | tee -a "$GITHUB_STEP_SUMMARY"
      # 대체 경로: API LLM 으로 아이디어 쓰기 (수동 실행에서 ideas_api=true 일 때만, 1회 ≈ $0.3)
      - name: Write investment ideas (API fallback)
        if: ${{ inputs.ideas_api == 'true' && inputs.no_llm != 'true' }}
        working-directory: pipeline
        env:
          IN_IDEAS_MODEL: ${{ inputs.ideas_model || 'sonnet' }}
        run: |
          set -euo pipefail
          python -m wsj.ecosystems.ideas --no-feed --model "$IN_IDEAS_MODEL" --out data/issues/ideas.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issues-${{ github.run_id }}
          path: pipeline/data/issues
          if-no-files-found: ignore
          retention-days: 7
