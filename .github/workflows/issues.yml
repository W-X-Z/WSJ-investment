# 공급망 이슈 피드 (ADR-0014). 시크릿: SUPABASE_URL, SUPABASE_SECRET_KEY, ANTHROPIC_API_KEY
# 매일 06:47 KST (21:47 UTC): 뉴스·업계지·뉴스룸·SEC 8-K·관보·정책·TrendForce·논문(arXiv·OpenAlex)·지표(메모리 현물가·PPI·대만 월매출)
# → 선별·요약(Sonnet, 1회 ≈ $0.1) → ideas.supply_chain_issues, ideas.indicator_points
name: issues

on:
  schedule:
    - cron: "47 21 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "수집 창(일)"
        required: false
        default: "14"
      model:
        description: "선별 모델: sonnet | haiku"
        required: false
        default: "sonnet"
      no_llm:
        description: "true 면 규칙 점수만"
        required: false
        default: "false"

concurrency:
  group: issues
  cancel-in-progress: false

jobs:
  issues:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WSJ_STORE: postgrest
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      SEC_USER_AGENT: "WSJ-investment research dnltmdwhd@gmail.com"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install
        working-directory: pipeline
        run: pip install -e .
      - name: Collect, curate and save issues
        working-directory: pipeline
        env:
          IN_DAYS: ${{ inputs.days || '14' }}
          IN_MODEL: ${{ inputs.model || 'sonnet' }}
          IN_NO_LLM: ${{ inputs.no_llm || 'false' }}
        run: |
          set -euo pipefail
          args=(run --days "$IN_DAYS" --model "$IN_MODEL" --out data/issues/latest.json)
          [[ "$IN_NO_LLM" == "true" ]] && args+=(--no-llm)
          python -m wsj.ecosystems.issues "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issues-${{ github.run_id }}
          path: pipeline/data/issues
          if-no-files-found: ignore
          retention-days: 14
