# 공급망 이슈 피드 (ADR-0014) + 투자 아이디어 (ADR-0016). 시크릿: SUPABASE_URL, SUPABASE_SECRET_KEY, ANTHROPIC_API_KEY,
# 선택: DART_API_KEY (한국 공시), OPENALEX_API_KEY
# 하루 두 번 — 06:47 KST (21:47 UTC, 미국 장 마감 뒤) · 18:47 KST (09:47 UTC, 아시아 장 마감·공시 뒤):
# 뉴스·업계지·뉴스룸·SEC 8-K·관보·정책·TrendForce·논문·지표 → 이슈 선별(Sonnet) → ideas.supply_chain_issues
# → 기업별 최신 소식(SEC·TWSE/TPEx·TDnet·cninfo·DART 공시, 월매출, 기업명 뉴스) → ideas.company_events
# → 투자 아이디어(Sonnet) → ideas.investment_ideas. 한 번에 ≈ $0.4
name: issues

on:
  schedule:
    - cron: "47 21 * * *"
    - cron: "47 9 * * *"
  push:  # 수집·선별 코드가 바뀌면 바로 검증 실행 (public 레포라 표준 러너 무료)
    branches: [main]
    paths:
      - "pipeline/wsj/ecosystems/issues.py"
      - "pipeline/wsj/ecosystems/sources.py"
      - "pipeline/wsj/ecosystems/indicators.py"
      - "pipeline/wsj/ecosystems/ideas.py"
      - "pipeline/wsj/ecosystems/company_feed.py"
      - "research/ecosystems/seed_graph.json"
      - ".github/workflows/issues.yml"
  workflow_dispatch:
    inputs:
      days:
        description: "수집 창(일)"
        required: false
        default: "14"
      model:
        description: "선별 모델: sonnet | haiku"
        required: false
        default: "sonnet"
      no_llm:
        description: "true 면 규칙 점수만"
        required: false
        default: "false"
      ideas_model:
        description: "투자 아이디어 모델: sonnet | opus"
        required: false
        default: "sonnet"

concurrency:
  group: issues
  cancel-in-progress: false

jobs:
  issues:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WSJ_STORE: postgrest
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      SEC_USER_AGENT: "WSJ-investment research dnltmdwhd@gmail.com"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install
        working-directory: pipeline
        run: pip install -e .
      - name: Collect, curate and save issues
        working-directory: pipeline
        env:
          IN_DAYS: ${{ inputs.days || '14' }}
          IN_MODEL: ${{ inputs.model || 'sonnet' }}
          IN_NO_LLM: ${{ inputs.no_llm || 'false' }}
        run: |
          set -euo pipefail
          args=(run --days "$IN_DAYS" --model "$IN_MODEL" --out data/issues/latest.json)
          [[ "$IN_NO_LLM" == "true" ]] && args+=(--no-llm)
          python -m wsj.ecosystems.issues "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      # 투자 아이디어 (ADR-0016): 방금 저장한 이슈 + 지표 + 기업별 최신 소식(지금 수집 + 최근 14일 누적) + 그래프
      # → 후보 사슬 → LLM → 검증(14일 안 근거 필수) → ideas.investment_ideas (1회 ≈ $0.3)
      - name: Write investment ideas
        if: ${{ inputs.no_llm != 'true' }}
        working-directory: pipeline
        env:
          IN_IDEAS_MODEL: ${{ inputs.ideas_model || 'sonnet' }}
        run: |
          set -euo pipefail
          python -m wsj.ecosystems.ideas --model "$IN_IDEAS_MODEL" --out data/issues/ideas.json --events-out data/issues/company_events.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issues-${{ github.run_id }}
          path: pipeline/data/issues
          if-no-files-found: ignore
          retention-days: 14
