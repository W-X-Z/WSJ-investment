# 3단계 심층 리서치 코드 도구 (wsj.deep, 설계 v3): 종목 → 대상 확정 → 공시 → 구조 카드 → 프로필 JSON.
# 구조 카드는 research.reports(kind='company', 'card:us:<티커>:<연도>')에 저장되고, 같은 공시는 다시 부르지 않는다.
#
# 비용: 미국 문서 1건당 소형 모델(Haiku 5.5) 1~2회 ≈ $0.01. 종목 하나(연차 3건) ≈ $0.03. 한국은 공급망 지도 조회(무료).
# 실행: Actions → deep → Run workflow (symbols 에 공백으로 여러 개). dry 면 추출은 하되 DB 에 쓰지 않는다.
# 개발 브랜치(feat/v3-*)에서는 커밋 메시지에 [deep-probe] 가 있을 때만 돈다 — 시험용.
# [monitor-probe] 가 있으면 monitor 시험(screen → monitor run → 대기열 카드)을 돈다 — monitor.yml 은 main 에 합쳐진 뒤에만 실행 버튼이 생긴다.
name: deep

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "종목 (공백 구분): FPS LEU 001440"
        required: true
        default: "FPS"
      command:
        description: "profile | cards | filings | target"
        required: false
        default: "profile"
      years:
        description: "연차보고서 개수"
        required: false
        default: "3"
      dry:
        description: "true 면 DB 에 쓰지 않는다"
        type: boolean
        required: false
        default: false
  push:
    branches: ["feat/v3-**"]

concurrency:
  group: deep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deep:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deep-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WSJ_STORE: postgrest
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      SUPPLYMAP_DB_URL: ${{ secrets.SUPPLYMAP_DB_URL }}
      SEC_USER_AGENT: "WSJ-investment research dnltmdwhd@gmail.com"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install
        working-directory: pipeline
        run: pip install -e ".[supplymap]"
      - name: Run deep tools
        working-directory: pipeline
        env:
          IN_SYMBOLS: ${{ inputs.symbols || 'FPS LEU 001440' }}
          IN_COMMAND: ${{ inputs.command || 'profile' }}
          IN_YEARS: ${{ inputs.years || '3' }}
          IN_DRY: ${{ inputs.dry && 'true' || 'false' }}
        run: |
          set -uo pipefail
          mkdir -p data/deep
          rc=0
          for s in $IN_SYMBOLS; do
            args=(deep "$IN_COMMAND" "$s" -v)
            [[ "$IN_COMMAND" != "target" ]] && args+=(--years "$IN_YEARS")
            [[ "$IN_DRY" == "true" && ( "$IN_COMMAND" == "cards" || "$IN_COMMAND" == "profile" ) ]] && args+=(--dry)
            python -m wsj "${args[@]}" > "data/deep/${IN_COMMAND}-${s}.json" || rc=1
            python -c "import json,sys;d=json.load(open(sys.argv[1]));print(sys.argv[1], 'usage', d.get('usage_usd'), 'errors', d.get('errors') or d.get('error'))" "data/deep/${IN_COMMAND}-${s}.json" || true
          done
          exit $rc
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-${{ github.run_id }}
          path: pipeline/data/deep
          if-no-files-found: ignore
          retention-days: 14

  monitor-probe:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[monitor-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WSJ_STORE: postgrest
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SEC_USER_AGENT: "WSJ-investment research dnltmdwhd@gmail.com"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install
        working-directory: pipeline
        run: pip install -e .
      - name: screen → monitor → queue cards
        working-directory: pipeline
        run: |
          set -uo pipefail
          mkdir -p data/monitor
          python -m wsj screen --hours 48 --out data/monitor/screen.json > data/monitor/screen-stdout.json || echo "screen failed"
          tail -c 1500 data/monitor/screen-stdout.json; echo
          python -m wsj monitor run --max-events 6 --max-usd 1.5 --out data/monitor/candidates.json | tee data/monitor/monitor-stdout.json
          python -m wsj monitor queue > data/monitor/queue.json
          for s in $(python -c "import json;q=json.load(open('data/monitor/queue.json'))['queue'];print(' '.join(sorted({c['symbol'] for c in q})))"); do
            python -m wsj deep cards "$s" --compact > "data/monitor/cards-$s.json" || echo "cards $s failed"
          done
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-probe-${{ github.run_id }}
          path: pipeline/data/monitor
          if-no-files-found: ignore
          retention-days: 14
