name: web-quality

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "supabase/migrations/0011_technology_intelligence.sql"
      - ".github/workflows/web-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify bundled technology seed matches source graph
        run: python3 apps/web/scripts/sync_ecosystem_seed.py --check
      - name: Install dependencies from lockfile
        working-directory: apps/web
        run: npm ci
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Production build, no live secrets
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
