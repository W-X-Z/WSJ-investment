name: technology-intelligence-monitor

on:
  schedule:
    # 08:30, 14:30, 20:30, 02:30 KST (UTC 23:30, 05:30, 11:30, 17:30).
    # GitHub cron can run late; reports record actual observed_at.
    - cron: "30 5,11,17,23 * * *"
  push:
    branches: [main]
    paths:
      - "pipeline/wsj/ecosystems/monitor.py"
      - "pipeline/wsj/ecosystems/publish_digest.py"
      - "research/ecosystems/seed_graph.json"
      - ".github/workflows/technology-intelligence-monitor.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: "Auto: 20:30 KST daily synthesis, other runs lightweight watch"
        required: false
        type: choice
        options: [auto, watch, daily]
        default: auto
      no_ai:
        description: "Skip Anthropic daily optional analysis; still create evidence/rule-based report"
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - "pipeline/wsj/ecosystems/monitor.py"
      - "pipeline/wsj/ecosystems/publish_digest.py"
      - "pipeline/tests/test_ecosystem_monitor.py"
      - "research/ecosystems/seed_graph.json"
      - ".github/workflows/technology-intelligence-monitor.yml"

concurrency:
  group: technology-intelligence-monitor-${{ github.ref == 'refs/heads/main' && 'production' || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unit-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install monitor test dependencies
        working-directory: pipeline
        run: pip install -e ".[dev]"
      - name: Run isolated monitoring tests (no network, no paid API)
        working-directory: pipeline
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_ecosystem_monitor.py tests/test_ecosystem_impact.py

  monitor:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SEC_USER_AGENT: "WSJ-investment research dnltmdwhd@gmail.com"
      WSJ_MONITOR_MODEL: "haiku"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install existing collection and AI dependencies
        working-directory: pipeline
        run: pip install -e .
      - name: Resolve watch or daily mode
        id: mode
        shell: bash
        env:
          INPUT_STAGE: ${{ inputs.stage }}
          INPUT_NO_AI: ${{ inputs.no_ai }}
        run: |
          set -euo pipefail
          KST_HOUR="$(TZ=Asia/Seoul date +%H)"
          mode="$INPUT_STAGE"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then mode="watch"; fi
          if [[ "$GITHUB_EVENT_NAME" != "push" && "$mode" != "watch" && "$mode" != "daily" ]]; then
            if [[ "$KST_HOUR" == "20" ]]; then mode="daily"; else mode="watch"; fi
          fi
          echo "stage=$mode" >> "$GITHUB_OUTPUT"
          echo "no_ai=${INPUT_NO_AI:-false}" >> "$GITHUB_OUTPUT"
          echo "Monitor mode=$mode (actual KST hour=$KST_HOUR)"
      - name: Restore durable monitoring checkpoint from preceding successful run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/monitor
          previous="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow technology-intelligence-monitor.yml --branch main --status success --json databaseId --limit 10 --jq '.[].databaseId' || true)"
          if [[ -z "$previous" ]]; then
            echo "No previous successful run; this is initial data-baseline creation."
            exit 0
          fi
          restored="false"
          while IFS= read -r runid; do
            [[ -z "$runid" || "$runid" == "$GITHUB_RUN_ID" ]] && continue
            if gh run download "$runid" --repo "$GITHUB_REPOSITORY" --name tech-intelligence-checkpoint --dir research/monitor 2>/dev/null; then
              restored="true"
              echo "Restored research checkpoint from run $runid"
              break
            fi
          done <<< "$previous"
          if [[ "$restored" != "true" ]]; then
            echo "::error::Earlier successful research runs exist but their checkpoints are missing. Refusing to reset the baseline silently."
            exit 1
          fi
          test -f research/monitor/state.json
      - name: Harvest public evidence / dedupe / propose hypotheses
        shell: bash
        working-directory: pipeline
        env:
          RUN_STAGE: ${{ steps.mode.outputs.stage }}
          INPUT_NO_AI: ${{ steps.mode.outputs.no_ai }}
        run: |
          set -euo pipefail
          args=(--stage "$RUN_STAGE" --out-dir ../research/monitor --state ../research/monitor/state.json)
          if [[ "$INPUT_NO_AI" == "true" ]]; then args+=(--no-ai); fi
          python -m wsj.ecosystems.monitor "${args[@]}"
      - name: Publish one research issue per week with daily report comments
        if: steps.mode.outputs.stage == 'daily'
        working-directory: pipeline
        run: python -m wsj.ecosystems.publish_digest --report ../research/monitor/run-summary.md
      - name: Write concise evidence summary to Actions job
        if: always()
        shell: bash
        run: |
          if [[ -f research/monitor/run-summary.md ]]; then
            head -c 30000 research/monitor/run-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Research run stopped before evidence summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload evidence checkpoint for next scheduled run
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tech-intelligence-checkpoint
          path: research/monitor/
          if-no-files-found: error
          retention-days: 30
