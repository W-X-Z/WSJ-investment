# 공급망 해자 카드 (ADR-0013). 시크릿: SUPABASE_URL, SUPABASE_SECRET_KEY, ANTHROPIC_API_KEY
# 1) 그래프 in_universe 기업을 core.companies 유니버스에 동기화  2) 해자 카드 생성 (Sonnet, 건당 ≈ $0.2~0.4)
name: moat

# 2026-11-02 예약 끔 (백로그 M-2): 지금 판단 사슬(해석·검토·리포트)은 해자 카드를 읽지 않고, 돌 때마다 API 비용(카드당 ≈ $0.2~0.4)이 든다.
# 옛 카드는 DB 에 남고 웹 discovery·briefs 화면은 그대로 보인다. 필요하면 수동 실행(workflow_dispatch)으로 돌린다.
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "대상 티커 (공백 구분). 비우면 그래프 in_universe 전부"
        required: false
        default: ""
      model:
        description: "sonnet | haiku | opus"
        required: false
        default: "sonnet"
      dry_run:
        description: "true 면 LLM 없이 입력만 아티팩트로"
        required: false
        default: "false"
      force:
        description: "true 면 같은 기준일 카드가 있어도 재생성"
        required: false
        default: "false"

concurrency:
  group: moat
  cancel-in-progress: false

jobs:
  moat:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WSJ_STORE: postgrest
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SEC_USER_AGENT: "WSJ-investment research dnltmdwhd@gmail.com"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install
        working-directory: pipeline
        run: pip install -e .
      - name: Sync ontology companies into universe
        working-directory: pipeline
        run: python -m wsj.ecosystems.universe sync
      - name: Build moat cards
        working-directory: pipeline
        env:
          IN_TICKERS: ${{ inputs.tickers }}
          IN_MODEL: ${{ inputs.model || 'sonnet' }}
          IN_DRY: ${{ inputs.dry_run || 'false' }}
          IN_FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          args=(--model "$IN_MODEL" --out data/moat)
          if [[ -n "${IN_TICKERS//[[:space:]]/}" ]]; then
            read -r -a t <<< "$IN_TICKERS"; args+=(--ticker "${t[@]}")
          else
            args+=(--all)
          fi
          [[ "$IN_DRY" == "true" ]] && args+=(--dry-run)
          [[ "$IN_FORCE" == "true" ]] && args+=(--force)
          python -m wsj moat build "${args[@]}"
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moat-${{ github.run_id }}
          path: pipeline/data/moat
          if-no-files-found: ignore
          retention-days: 30
