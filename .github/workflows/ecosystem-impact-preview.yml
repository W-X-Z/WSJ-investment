name: ecosystem-impact-preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/ecosystems/**"
      - "pipeline/wsj/ecosystems/**"
      - ".github/workflows/ecosystem-impact-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reproduce technical impact paths from source-backed fixture, no API calls
        working-directory: pipeline
        env:
          PYTHONPATH: .
        run: |
          python -m wsj.ecosystems.impact --as-of 2026-10-26 --out ../research/ecosystems/impact_preview.json
      - name: Summarize impact candidates without claiming revenue
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path('research/ecosystems/impact_preview.json').read_text())
          lines = ['## Supply-chain ecosystem impact **research candidates**', '',
                   '**NOT live monitoring, not verified customer revenue, not investment advice.**', '',
                   '| Event | Potential company pathways | Watch candidates |',
                   '|---|---:|---:|']
          for event in p['events']:
              lines.append(f"| {event['event_id']} | {len(event['possible_company_paths'])} | {len(event['watch_candidates'])} |")
          lines.append('')
          lines.append('Graph relationships include vendor claims and inferred technology dependence; validate external customer adoption separately.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n'.join(lines) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ecosystem-impact-preview-json
          path: research/ecosystems/impact_preview.json
          retention-days: 7
