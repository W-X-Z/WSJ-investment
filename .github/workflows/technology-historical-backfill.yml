name: technology-historical-backfill

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "First historical publication year"
        type: choice
        default: "2020"
        options: ["2018","2019","2020","2021","2022","2023"]
  push:
    branches: [feat/historical-backfill-graph-canvas-20261026]
    paths:
      - "pipeline/wsj/ecosystems/backfill.py"
      - ".github/workflows/technology-historical-backfill.yml"

permissions:
  contents: write

concurrency:
  group: technology-historical-backfill
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install existing pipeline (no paid LLM)
        working-directory: pipeline
        run: pip install -e .
      - name: Collect historical technology evidence, 2020-2026
        working-directory: pipeline
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SEC_USER_AGENT: "WSJ-investment research dnltmdwhd@gmail.com"
          START_YEAR: ${{ inputs.start_year }}
        run: |
          set -euo pipefail
          PYTHONUNBUFFERED=1 python -m wsj.ecosystems.backfill \
            --since-year "${START_YEAR:-2020}" --until-year 2026 \
            --per-page 40 --pages 2 --max-sec-year 45 \
            --out-dir ../research/backfill
      - name: Publish a bounded research index for the web canvas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source=Path('research/backfill')
          target=Path('apps/web/src/data')
          target.mkdir(parents=True,exist_ok=True)
          data={
            'summary': json.loads((source/'summary.json').read_text()),
            'events': json.loads((source/'feed-index.json').read_text())
          }
          (target/'historical-evidence.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Re-index technical ontology against corrected historical corpus
        env:
          PYTHONPATH: pipeline
        run: |
          set -euo pipefail
          python -m wsj.ecosystems.enrich_graph --as-of "$(date -u +%F)"
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('research/enriched/summary.json').read_text())
          assert s['new_confirmed_supply_edges'] == 0
          Path('apps/web/src/data/relation-candidates.json').write_text(Path('research/enriched/relation-candidates.json').read_text())
          assert s['unique_valid_sources'] > 100
          print("Review-only graph index linked",s['documents_with_ontology_matches'],"documents")
          PY
      - name: Archive immutable historical samples in branch
        if: github.ref == 'refs/heads/feat/historical-backfill-graph-canvas-20261026'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/backfill research/enriched apps/web/src/data/historical-evidence.json apps/web/src/data/graph-evidence-index.json apps/web/src/data/relation-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "data: six-year technology-supply-chain historical source backfill"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          else
            echo "No historical content changed"
          fi
      - name: Report collection coverage and partial-source failures
        if: always()
        shell: bash
        run: |
          if [[ -f research/backfill/summary.json ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          x=json.loads(Path('research/backfill/summary.json').read_text())
          print('## Historical evidence backfill')
          print(f"Period: {x['historical_period'][0]}–{x['historical_period'][1]} | Rows: {x['records']} | Status: {x['status']}")
          print('\n### By ecosystem')
          for k,v in x['by_ecosystem'].items(): print(f'- {k}: {v}')
          print('\n### Source')
          for k,v in x['by_source'].items(): print(f'- {k}: {v}')
          print(f"\nFailed source segments: **{len(x['failed_source_segments'])}** (see artifact)")
          print('\nMetadata and indexed abstracts are not independent proof of technical performance. Historical public dates are not historical collector observations.')
          PY
          else
            echo "Backfill failed before summary file creation" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: technology-backfill-2020-2026
          path: |
            research/backfill/
            apps/web/src/data/historical-evidence.json
          if-no-files-found: warn
          retention-days: 30
