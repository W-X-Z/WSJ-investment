# 선별 에이전트 (screen, wsj.agents.screen): 지난 창의 관련 단서(ideas.clues relevant + 본문)를 '변화 사건'으로 묶고,
# 아이디어 작업을 받을 사건을 골라 하루 보고서 한 건(report_id 'screen:YYYY-MM-DD', kind 'screen')을 research.put_reports 로 쓴다.
# 오케스트레이터(Claude 예약 세션)가 나중에 이 보고서를 읽는다. 실행 기록은 ops.put_agent_run(task=screen).
#
# 비용 (Sonnet 5.5, 지금 수집량 — 단서 ≈1,200건/평일 중 관련 ≈30%, 본문 ≈85건): 하루 ≈ $0.5–1.5.
# 실행당 상한: SCREEN_MAX_USD(기본 $2) · SCREEN_MAX_INPUT_TOKENS(기본 40만). 넘을 것 같으면 묶음을 더 보내지 않고 처리한 만큼 쓴다.
# LLM 없이 묶음·어림 비용만 보려면 dry_run 대신 로컬에서 `python -m wsj screen --plan`.
#
# 지금은 수동 실행(Run workflow)만 한다. 매일 돌리려면 아래 schedule 두 줄의 주석을 푼다 (05:40 KST 월~토).
# ⚠ 주석을 푸는 순간부터 매일 API 비용이 나간다. 수집(issues/collect) 뒤에 돌도록 시각을 잡았다.
name: screen

on:
  # schedule:
  # - cron: '40 20 * * 0-5'
  workflow_dispatch:
    inputs:
      hours:
        description: "창(시간, seen_at 기준)"
        required: false
        default: "24"
      model:
        description: "모델: claude-sonnet-5-5 | claude-haiku-5-5 | claude-opus-5-5 (또는 sonnet·haiku·opus)"
        required: false
        default: "claude-sonnet-5-5"
      dry_run:
        description: "true 면 LLM 은 부르되 DB 에 쓰지 않는다 (보고서는 아티팩트로)"
        type: boolean
        required: false
        default: false

concurrency:
  group: screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WSJ_STORE: postgrest
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # SCREEN_MAX_USD: "2.0"
      # SCREEN_MAX_INPUT_TOKENS: "400000"
      # SCREEN_REPORT_RPC: "research.put_reports"   # 'schema.function'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install
        working-directory: pipeline
        run: pip install -e .
      - name: Screen clues into change events
        working-directory: pipeline
        env:
          IN_HOURS: ${{ inputs.hours || '24' }}
          IN_MODEL: ${{ inputs.model || 'claude-sonnet-5-5' }}
          IN_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p data/screen
          args=(screen --hours "$IN_HOURS" --model "$IN_MODEL" --out data/screen/report.json)
          [[ "$IN_DRY_RUN" == "true" ]] && args+=(--dry-run)
          python -m wsj "${args[@]}" > data/screen/stdout.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-${{ github.run_id }}
          path: pipeline/data/screen
          if-no-files-found: ignore
          retention-days: 14
