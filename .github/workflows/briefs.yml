# 브리프 생성 (Analyst + Risk). 시크릿: SUPABASE_URL, SUPABASE_SECRET_KEY, ANTHROPIC_API_KEY
# 저비용 기본: Haiku 5.5 3단계, 웹 검색 4회. 중요한 후보는 model=sonnet 으로 상향.
name: briefs

on:
  # 정기 실행 종료 (2026-10-27): 기존 후보 스크리너용 브리프는 아카이브 기능이고, 투자 아이디어 피드가 대체했다. 수동 실행만.
  workflow_dispatch:
    inputs:
      ciks:
        description: "대상 CIK (공백 구분). 비우면 candidates new/watch 점수순"
        required: false
        default: ""
      top:
        description: "후보 상위 N (ciks 가 비었을 때)"
        required: false
        default: "3"
      model:
        description: "종합 단계 모델: sonnet | opus | fable"
        required: false
        default: "haiku"
      research_model:
        description: "웹 리서치 모델 (기본 haiku)"
        required: false
        default: "haiku"
      critique_model:
        description: "비평 모델 (기본 haiku)"
        required: false
        default: "haiku"
      searches:
        description: "웹 검색 상한 (기본 4)"
        required: false
        default: "4"
      dry_run:
        description: "true 면 LLM 없이 데이터팩·프롬프트만 아티팩트로"
        required: false
        default: "false"
      force:
        description: "true 면 같은 기준일 브리프가 있어도 재생성"
        required: false
        default: "false"

concurrency:
  group: briefs
  cancel-in-progress: false

jobs:
  briefs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WSJ_STORE: postgrest
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SEC_USER_AGENT: "WSJ-investment research dnltmdwhd@gmail.com"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install
        working-directory: pipeline
        run: pip install -e .
      - name: Build briefs
        working-directory: pipeline
        env:
          BRIEF_CIKS: ${{ inputs.ciks }}
          BRIEF_TOP: ${{ inputs.top || '3' }}
          BRIEF_MODEL: ${{ inputs.model || 'haiku' }}
          BRIEF_RESEARCH_MODEL: ${{ inputs.research_model || 'haiku' }}
          BRIEF_CRITIQUE_MODEL: ${{ inputs.critique_model || 'haiku' }}
          BRIEF_SEARCHES: ${{ inputs.searches || '4' }}
          BRIEF_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          BRIEF_FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          args=()
          ciks="${BRIEF_CIKS#ciks=}"
          ciks="${ciks//,/ }"
          if [[ -n "${ciks//[[:space:]]/}" ]]; then
            read -r -a cik_values <<< "$ciks"
            for cik in "${cik_values[@]}"; do
              if [[ ! "$cik" =~ ^[0-9]+$ ]]; then
                echo "Invalid CIK: $cik (numeric CIK only)" >&2
                exit 2
              fi
            done
            args+=(--cik "${cik_values[@]}")
          else
            args+=(--top "$BRIEF_TOP")
          fi
          args+=(--model "$BRIEF_MODEL" --research-model "$BRIEF_RESEARCH_MODEL")
          args+=(--critique-model "$BRIEF_CRITIQUE_MODEL" --searches "$BRIEF_SEARCHES")
          if [[ "$BRIEF_DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          if [[ "$BRIEF_FORCE" == "true" ]]; then args+=(--force); fi
          python -m wsj briefs build "${args[@]}" --out data/briefs
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefs-${{ github.run_id }}
          path: pipeline/data/briefs
          if-no-files-found: ignore
          retention-days: 30
