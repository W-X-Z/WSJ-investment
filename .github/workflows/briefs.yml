# 브리프 생성 (Analyst + Risk). 시크릿: SUPABASE_URL, SUPABASE_SECRET_KEY, ANTHROPIC_API_KEY
# 비용은 후보 수에 비례한다 (건당 ≈ $0.3~0.7, Sonnet 기준). 주 1회 상위 5건 + 수동 실행.
name: briefs

on:
  schedule:
    - cron: "23 12 * * 1"   # 월 12:23 UTC = 서울 21:23 — 주간 수집 뒤 후보 상위 N 브리프
  workflow_dispatch:
    inputs:
      ciks:
        description: "대상 CIK (공백 구분). 비우면 candidates new/watch 점수순"
        required: false
        default: ""
      top:
        description: "후보 상위 N (ciks 가 비었을 때)"
        required: false
        default: "3"
      model:
        description: "종합 단계 모델: sonnet | opus | fable"
        required: false
        default: "sonnet"
      dry_run:
        description: "true 면 LLM 없이 데이터팩·프롬프트만 아티팩트로"
        required: false
        default: "false"
      force:
        description: "true 면 같은 기준일 브리프가 있어도 재생성"
        required: false
        default: "false"

concurrency:
  group: briefs
  cancel-in-progress: false

jobs:
  briefs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WSJ_STORE: postgrest
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SEC_USER_AGENT: "WSJ-investment research dnltmdwhd@gmail.com"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install
        working-directory: pipeline
        run: pip install -e .
      - name: Build briefs
        working-directory: pipeline
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.ciks }}" ]; then ARGS="$ARGS --cik ${{ github.event.inputs.ciks }}"; else ARGS="$ARGS --top ${{ github.event.inputs.top || '5' }}"; fi
          ARGS="$ARGS --model ${{ github.event.inputs.model || 'sonnet' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python -m wsj briefs build $ARGS --out data/briefs
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefs-${{ github.run_id }}
          path: pipeline/data/briefs
          if-no-files-found: ignore
          retention-days: 30
