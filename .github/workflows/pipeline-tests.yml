name: pipeline-tests

on:
  pull_request:
    paths:
      - "pipeline/**"
      - "research/**"
      - "apps/web/src/data/**"
      - "supabase/migrations/**"
      - ".github/workflows/pipeline-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    # 통합 검증(tests/integration): 선별 → PostgrestStore → PostgREST 대역 → 이 Postgres 의 0040 함수
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WSJ_IT_PG_DSN: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install test dependencies
        working-directory: pipeline
        run: pip install -e ".[dev]"
      - name: Run unit tests (no external API calls)
        working-directory: pipeline
        run: pytest -q
      - name: Ontology closed-vocabulary check and web data sync
        working-directory: pipeline
        run: |
          python -m wsj.ecosystems.ontology --check
          python -m wsj.ecosystems.export_web --check
