# 수집 스케줄. 시크릿: SUPABASE_URL, SUPABASE_SECRET_KEY, (선택) OPENFDA_API_KEY
# 시간은 UTC. 미국 공시·FINRA T+1 데이터가 반영된 뒤(미 동부 새벽)에 돈다.
name: collect

on:
  schedule:
    - cron: "17 10 * * 1-5"   # 평일 10:17 UTC = 미 동부 06:17 / 서울 19:17 — 일간 수집기
    - cron: "41 11 * * 6"     # 토 11:41 UTC — 유니버스 재구축
  workflow_dispatch:
    inputs:
      collectors:
        description: "실행할 수집기 (공백 구분). 비우면 일간 전체, none 이면 수집 없이 매칭·신호만"
        required: false
        default: ""
      since:
        description: "--since YYYY-MM-DD (워터마크 무시)"
        required: false
        default: ""

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WSJ_STORE: postgrest
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
      SEC_USER_AGENT: "WSJ-investment research dnltmdwhd@gmail.com"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install
        working-directory: pipeline
        run: pip install -e .
      - name: Decide what to run
        id: plan
        run: |
          if [ -n "${{ github.event.inputs.collectors }}" ]; then
            echo "names=${{ github.event.inputs.collectors }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "41 11 * * 6" ]; then
            echo "names=sec_universe" >> "$GITHUB_OUTPUT"
          else
            echo "names=sec_form4 sec_filings finra clinicaltrials openfda usaspending" >> "$GITHUB_OUTPUT"
          fi
      - name: Run collectors
        if: steps.plan.outputs.names != 'none'
        working-directory: pipeline
        run: |
          SINCE=""
          if [ -n "${{ github.event.inputs.since }}" ]; then SINCE="--since ${{ github.event.inputs.since }}"; fi
          # 각 수집기를 따로 실행해 하나의 실패가 나머지를 막지 않게 한다 (러너도 격리하지만 로그 분리용)
          rc=0
          for name in ${{ steps.plan.outputs.names }}; do
            python -m wsj run "$name" $SINCE || rc=1
          done
          exit $rc
      - name: Resolve entities
        if: always()
        working-directory: pipeline
        run: python -m wsj entities resolve
      - name: Build signals and candidates
        if: always()
        working-directory: pipeline
        run: python -m wsj signals build
