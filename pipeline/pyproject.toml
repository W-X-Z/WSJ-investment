[project]
name = "wsj"
version = "0.1.0"
description = "WSJ-investment data collection pipeline (Data Desk)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "anthropic>=0.60",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# 논문·특허 백필 (사용자 PC 에서만): python -m wsj.ecosystems.techdocs
techdocs = ["google-cloud-bigquery>=3.11"]

[project.scripts]
wsj = "wsj.runner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wsj*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # 포맷터가 못 줄이는 긴 문자열 허용

[tool.pytest.ini_options]
testpaths = ["tests"]
